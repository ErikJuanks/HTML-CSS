<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .items{
            border: 1px dashed black;
            text-align: center;
        }
        .container{
            display: grid;
            grid-auto-rows: 100px;
            grid-auto-columns: auto;
            grid-template: 100px 100px 100px / auto auto auto;
            border: 3px solid green;
            height: 50vh;
            place-content: center normal;
            place-items: stretch normal;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="items">A</div>
        <div class="items">B</div>
        <div class="items">C</div>
        <div class="items">D</div>
        <div class="items">E</div>
        <div class="items">F</div>
        <div class="items">G</div>
        <div class="items">I</div>
        <div class="items">H</div>
        <div class="items">J</div>
    </div>
</body>
</html>
